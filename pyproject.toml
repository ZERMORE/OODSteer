[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "oodsteer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "transformers==4.46.3", "datasets==3.1.0", "accelerate==1.1.1", "numpy>=1.26,<3", "sentencepiece>=0.2", "protobuf>=4", "tqdm>=4.66"]
[project.scripts]
oodsteer = "oodsteer.cli:main"
[tool.setuptools.packages.find]
include = ["oodsteer*"]
